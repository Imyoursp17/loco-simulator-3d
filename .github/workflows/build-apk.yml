name: Build Web App Package
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare Web Package
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Upload Web App Distribution
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-Loco-Simulator-Web-Package
          path: dist/index.html
