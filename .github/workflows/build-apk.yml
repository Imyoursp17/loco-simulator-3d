name: Build Android APK Automatically
on: [push, workflow_dispatch]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Game Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wrap HTML5 3D Engine into Native Android Project
        run: |
          mkdir -p www && cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Bharat 3D Loco Simulator" "com.bharat.locosim3d" --web-dir www
          npx cap add android

      - name: Compile Installable APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-3D-Loco-Simulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
